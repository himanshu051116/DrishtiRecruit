services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracehire
    ports:
      - "5432:5432"
    volumes:
      - tracehire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracehire"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tracehire_pgdata:
